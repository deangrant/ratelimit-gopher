name: test

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            redisstore/go.sum
            postgresstore/go.sum

      - name: Build
        run: |
          go build ./...
          go build -C redisstore ./...
          go build -C postgresstore ./...

      - name: Test
        run: |
          go test ./... -race -count=1
          go test -C redisstore ./... -race -count=1
          go test -C postgresstore ./... -race -count=1

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        work-dir: [., redisstore, postgresstore]
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f
        with:
          go-version-file: go.mod
          go-package: ./...
          work-dir: ${{ matrix.work-dir }}
          cache-dependency-path: |
            redisstore/go.sum
            postgresstore/go.sum
